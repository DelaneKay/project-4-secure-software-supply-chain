name: Lab 4 foundation plan

on:
  workflow_dispatch:

permissions: {}

jobs:
  plan:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: lab4-apply

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: terraform/foundation

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Assume Lab 4 role using OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.LAB4_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Initialize remote state
        shell: bash
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          terraform init \
            -lockfile=readonly \
            -backend-config="bucket=lab4-tfstate-${account_id}"

      - name: Plan foundation
        run: terraform plan -no-color -input=false
