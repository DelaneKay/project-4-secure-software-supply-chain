name: Lab 4 AWS identity check

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify-identity:
    runs-on: ubuntu-latest
    environment: lab4-apply

    permissions:
      id-token: write

    steps:
      - name: Assume Lab 4 role using OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.LAB4_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Confirm assumed role
        shell: bash
        run: |
          arn="$(aws sts get-caller-identity --query Arn --output text)"
          case "$arn" in
            */project-4-terraform-apply-role/*)
              echo "Successfully assumed the Lab 4 Terraform apply role."
              ;;
            *)
              echo "Unexpected AWS identity."
              exit 1
              ;;
          esac
